<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Operacional</title>
  <link rel="stylesheet" href="./css/operational.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <span>Dashboard Operacional</span>
    <div class="header-actions">
      <div class="period-switch" role="group" aria-label="Filtro de período">
        <button class="period-btn active" data-period="7d">7 dias</button>
        <button class="period-btn" data-period="30d">30 dias</button>
        <button class="period-btn" data-period="90d">90 dias</button>
      </div>
      <select id="lang-select" class="theme-btn" aria-label="Idioma">
        <option value="pt-BR">PT</option>
        <option value="en-US">EN</option>
      </select>
      <button id="export-csv" class="theme-btn" aria-label="Exportar atividades">Exportar CSV</button>
      <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">Tema escuro</button>
      <button id="reload-data" class="theme-btn" aria-label="Atualizar dados">Atualizar</button>
      <a class="back-link" href="./index.html">Voltar para a galeria</a>
    </div>
  </header>
  <div class="layout">
    <section class="left">
      <div class="card"><div class="kpi-title">Pedidos hoje</div><div class="kpi-value" id="kpi-orders">-</div><div class="kpi-sub" id="kpi-orders-sub">-</div></div>
      <div class="card"><div class="kpi-title">Pendências</div><div class="kpi-value" id="kpi-pending">-</div><div class="kpi-sub" id="kpi-pending-sub">-</div></div>
      <div class="card"><div class="kpi-title">TMA (min)</div><div class="kpi-value" id="kpi-tma">-</div><div class="kpi-sub" id="kpi-tma-sub">-</div></div>
      <div class="card"><div class="kpi-title">Atendimentos (24h)</div><div class="kpi-value" id="kpi-service">-</div><div class="kpi-sub" id="kpi-service-sub">-</div></div>
    </section>
    <section class="right">
      <div id="state-loading" class="state-box active" role="status">Carregando dados...</div>
      <div id="state-empty" class="state-box">Sem dados para o período selecionado.</div>
      <div id="state-error" class="state-box">Erro ao carregar dados. Tente novamente.</div>

      <div class="card">
        <div class="chart-title">Produção por período</div>
        <div class="chart-wrap"><canvas id="graficoLinha" aria-label="Produção por período" role="img"></canvas></div>
      </div>
      <div class="card">
        <div class="chart-title">Volume por categoria</div>
        <div class="chart-wrap"><canvas id="graficoBarras" aria-label="Volume por categoria" role="img"></canvas></div>
      </div>
      <div class="card">
        <div class="chart-title">Últimas atividades</div>
        <table aria-label="Tabela de atividades">
          <thead><tr><th>Data</th><th>Operação</th><th>Status</th></tr></thead>
          <tbody id="activities-body"></tbody>
        </table>
      </div>
    </section>
  </div>
  <script src="./js/shared.js"></script>
  <script src="./js/operational.js"></script>
</body>
</html>
